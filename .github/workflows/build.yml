name: Build

# Сборка WebDriverAgent с командами OverView (альбом + очистка) в неподписанный .ipa.
# Запуск: вкладка Actions -> Build -> Run workflow. Готовый файл — в Artifacts внизу страницы сборки.
# Подписать и поставить: Sideloadly (как обычный WDA).

on:
  workflow_dispatch:
    inputs:
      wda_ref:
        description: "Версия appium/WebDriverAgent (тег или ветка)"
        required: false
        default: "master"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Get WebDriverAgent
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.wda_ref || 'master' }}" https://github.com/appium/WebDriverAgent.git wda

      - name: Apply OverView patch
        run: |
          set -e
          F=wda/WebDriverAgentLib/Commands/FBCustomCommands.m
          test -f "$F"
          cat patches/OVPhotoCommands.m >> "$F"
          grep -n "OVPhotoCommands" "$F" | head -3

      - name: Build
        run: |
          set -o pipefail
          cd wda
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEBUG_INFORMATION_FORMAT=dwarf ARCHS=arm64 \
            'OTHER_LDFLAGS=$(inherited) -framework Photos' | tail -40

      - name: Add photo permission strings and package .ipa
        run: |
          set -e
          APP=$(find wda/build/Build/Products -maxdepth 2 -name "WebDriverAgentRunner-Runner.app" | head -1)
          echo "App: $APP"
          for P in "$APP/Info.plist" "$APP/PlugIns/WebDriverAgentRunner.xctest/Info.plist"; do
            [ -f "$P" ] || continue
            /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" "$P" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryAddUsageDescription" "$P" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string OverView saves creatives to the OverView album" "$P"
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string OverView saves creatives to the OverView album" "$P"
            /usr/libexec/PlistBuddy -c "Delete :UIFileSharingEnabled" "$P" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$P"
          done
          # dSYM внутри .app ломает подпись в Sideloadly — убираем
          find "$APP" -name "*.dSYM" -prune -exec rm -rf {} +
          find "$APP" -name "*.dSYM" | wc -l
          # Как в официальной сборке appium: без Frameworks/ верхнего уровня — XCTest берётся
          # из Developer-образа самого айфона (иначе старые копии из Xcode не стартуют на новой iOS).
          # WebDriverAgentLib.framework остаётся внутри PlugIns/*.xctest/Frameworks.
          rm -rf "$APP/Frameworks"
          ls "$APP/PlugIns/WebDriverAgentRunner.xctest/Frameworks" || true
          # Иконка и название «OverView»: собираем свой каталог картинок прямо в .app
          xcrun actool icon/Icons.xcassets --compile "$APP" --platform iphoneos \
            --minimum-deployment-target 15.0 --app-icon AppIcon --target-device iphone --target-device ipad \
            --output-partial-info-plist icon_partial.plist --output-format human-readable-text
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons~ipad" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Merge icon_partial.plist" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string OverView" "$APP/Info.plist"
          ls "$APP" | grep -i -E "appicon|assets" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist" || true
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../OverView-WDA.ipa Payload && cd ..
          ls -la OverView-WDA.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OverView-WDA
          path: OverView-WDA.ipa
          retention-days: 30
